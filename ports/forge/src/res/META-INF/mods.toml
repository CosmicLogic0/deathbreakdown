modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/CosmicLogic0/deathbreakdown/issues"

[[mods]]
modId = "deathbreakdown"
version = "${version}"
displayName = "Death Breakdown"
authors = "CosmicLogic"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/death-breakdown"
logoFile = "deathbreakdown.png"
# Players without the mod can still join (they get the chat recap), so don't mark the server as incompatible.
displayTest = "IGNORE_ALL_VERSION"
description = """
See exactly what killed you: every hit from your last 10 seconds, the damage, what your armor and enchantments blocked, and the final blow.
"""

[[dependencies.deathbreakdown]]
modId = "${loaderId}"
${mandatory}
versionRange = "[${loaderMajor},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.deathbreakdown]]
modId = "minecraft"
${mandatory}
versionRange = "${mcRange}"
ordering = "NONE"
side = "BOTH"
