// Death Breakdown for Forge 1.12.2. Build setup follows CleanroomMC's TemplateDevEnv (RetroFuturaGradle).
// 1.12.2 uses completely different (MCP) names, so it has its own small source in src/main/java;
// the recap logic, damage math, labels, text and config come from the same plain-Java core as every other version.
plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

version = "${project.mod_version}+forge-1.12.2"
group = 'com.cosmiclogic.deathbreakdown'
base { archivesName = 'deathbreakdown' }

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('Developer')
}

sourceSets.main.java.srcDir '../../core/src/main/java'
sourceSets.main.resources.srcDir layout.buildDirectory.dir('assets-res')
tasks.register('dbAssets', Sync) {
    from('../../common/src/main/resources') { include 'deathbreakdown.png' }
    into layout.buildDirectory.dir('assets-res')
}
processResources {
    dependsOn 'dbAssets'
    inputs.property 'version', project.mod_version
    filesMatching('mcmod.info') { expand 'version': project.mod_version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
