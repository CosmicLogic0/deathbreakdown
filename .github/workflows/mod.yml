# Fast checks on every push: the plain-Java core's unit tests, and the CI-only gallery screenshot helper still builds.
# The mod itself (every Minecraft version and loader: build, real server + selftest, real client) is tested by
# ports.yml; the Paper plugin by the deathbreakdown-plugin repo.
name: Mod build and test

on:
  push:
    paths-ignore: ['art/**', 'docs/**', '**.md']
  pull_request:
  workflow_dispatch:

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Core unit tests
        run: bash ci/core-test.sh

  shots-helper:
    needs: core-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the CI-only screenshot helper
        run: |
          chmod +x gradlew
          ./gradlew :shots:build --stacktrace
